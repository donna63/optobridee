<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optob - Register & Get Referral Code</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-orange-50 to-gray-100 min-h-screen flex items-center justify-center">

  <div class="container mx-auto px-4 py-12 max-w-md">
    
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-gradient-to-r from-orange-500 to-red-600 rounded-2xl flex items-center justify-center text-white text-2xl font-bold mx-auto mb-3">
        OR
      </div>
      <h1 class="text-2xl font-bold text-gray-800">Optob<span class="text-orange-500">Ride</span></h1>
      <p class="text-gray-500 text-sm mt-1">Register to get your referral code and earn rewards!</p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
      <div class="bg-gradient-to-r from-orange-500 to-red-600 px-6 py-4">
        <h2 class="text-xl font-bold text-white"><i class="fas fa-user-plus mr-2"></i> Create Account</h2>
      </div>
      <div class="p-6">
        <form id="registerForm">
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Full Name *</label>
              <input type="text" id="fullname" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Email Address *</label>
              <input type="email" id="email" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number *</label>
              <input type="tel" id="phone" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Password * (min 4 characters)</label>
              <input type="password" id="password" required minlength="4" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none">
              <p class="text-xs text-gray-500 mt-1">Must be at least 4 characters</p>
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-orange-500 to-red-600 text-white font-bold py-3 rounded-xl hover:opacity-90 transition shadow-md">
              <i class="fas fa-gift mr-2"></i> Register & Get My Code
            </button>
          </div>
        </form>
        <p class="text-center text-sm text-gray-500 mt-4">
          Already have an account? 
          <a href="login.html" class="text-orange-500 font-semibold hover:underline">Login here →</a>
        </p>
      </div>
    </div>

    <div id="successMessage" class="hidden mt-4 bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg text-center"></div>
    <div id="errorMessage" class="hidden mt-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg text-center"></div>
    <div id="debugMessage" class="hidden mt-4 bg-blue-100 border border-blue-400 text-blue-700 px-4 py-3 rounded-lg text-center text-sm"></div>
  </div>

  <script>
    // SUPABASE CONFIGURATION
    const SUPABASE_URL = "https://thiksscedkfmqcpatedq.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoaWtzc2NlZGtmbXFjcGF0ZWRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNDc2NzYsImV4cCI6MjA5MjYyMzY3Nn0.zI5_7tWfdoNG700HOyK4eDrCMiITD9MXyqtMTImNJKA";
    
    // Initialize Supabase - using a different variable name to avoid conflict
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    console.log('✅ Supabase initialized successfully');

    // Function to check if table exists and has proper structure
    async function checkDatabaseStructure() {
      try {
        const { data, error } = await supabaseClient
          .from('referrers')
          .select('*')
          .limit(1);
        
        if (error) {
          console.error('❌ Database structure error:', error);
          if (error.message.includes('relation "referrers" does not exist')) {
            showDebug('⚠️ Table "referrers" does not exist in your database. Please create it first.');
            return false;
          }
          return false;
        }
        
        console.log('✅ Database structure verified');
        return true;
      } catch (err) {
        console.error('❌ Database check failed:', err);
        return false;
      }
    }

    // Generate a unique referral code
    function generateReferralCode(name) {
      let prefix = name.substring(0, 3).toUpperCase().replace(/[^A-Z]/g, 'X');
      if (prefix.length < 3) prefix = prefix + 'X'.repeat(3 - prefix.length);
      
      const random = Math.random().toString(36).substring(2, 7).toUpperCase();
      return `${prefix}${random}`;
    }

    // Check if referral code is unique
    async function isReferralCodeUnique(code) {
      try {
        const { data, error } = await supabaseClient
          .from('referrers')
          .select('referral_code')
          .eq('referral_code', code)
          .maybeSingle();
        
        return !data;
      } catch (err) {
        console.error('Error checking referral code:', err);
        return false;
      }
    }

    // Check if email already exists
    async function isEmailUnique(email) {
      try {
        const { data, error } = await supabaseClient
          .from('referrers')
          .select('email')
          .eq('email', email.toLowerCase())
          .maybeSingle();
        
        return !data;
      } catch (err) {
        console.error('Error checking email:', err);
        return false;
      }
    }

    // Check database on load
    window.addEventListener('load', async () => {
      await checkDatabaseStructure();
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const fullname = document.getElementById('fullname').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      
      // Clear previous messages
      document.getElementById('errorMessage').classList.add('hidden');
      document.getElementById('successMessage').classList.add('hidden');
      
      // Validation
      if (!fullname || !email || !phone || !password) {
        showError('Please fill in all fields');
        return;
      }
      
      if (password.length < 4) {
        showError('Password must be at least 4 characters');
        return;
      }
      
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showError('Please enter a valid email address');
        return;
      }
      
      // Show loading state
      const submitBtn = document.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Processing...';
      submitBtn.disabled = true;
      
      try {
        // Check if email already exists
        const emailUnique = await isEmailUnique(email);
        if (!emailUnique) {
          showError('❌ Email already registered! Please login instead.');
          submitBtn.innerHTML = originalText;
          submitBtn.disabled = false;
          return;
        }
        
        // Generate unique referral code
        let referralCode = generateReferralCode(fullname);
        let isUnique = await isReferralCodeUnique(referralCode);
        
        let attempts = 0;
        while (!isUnique && attempts < 10) {
          referralCode = generateReferralCode(fullname + attempts);
          isUnique = await isReferralCodeUnique(referralCode);
          attempts++;
        }
        
        if (!isUnique) {
          referralCode = `USER${Date.now().toString().slice(-6)}`;
        }
        
        // Prepare user data
        const userData = {
          fullname: fullname,
          email: email,
          phone: phone,
          password: password, // ⚠️ Remember to hash this in production!
          referral_code: referralCode,
          referral_count: 0,
          earnings: 0,
          created_at: new Date().toISOString()
        };
        
        console.log('Attempting to insert user:', userData);
        
        // Insert new user into referrers table
        const { data: newUser, error } = await supabaseClient
          .from('referrers')
          .insert([userData])
          .select();
        
        if (error) {
          console.error('❌ Supabase insert error:', error);
          console.error('Error details:', error.message, error.code, error.details);
          
          if (error.code === '23505') {
            showError('❌ This email is already registered! Please login.');
          } else if (error.code === '42P01') {
            showError('❌ Database table not found. Please contact support.');
            showDebug(`Table "referrers" does not exist. Run this SQL in Supabase SQL Editor:

CREATE TABLE referrers (
  id BIGSERIAL PRIMARY KEY,
  fullname TEXT NOT NULL,
  email TEXT UNIQUE NOT NULL,
  phone TEXT NOT NULL,
  password TEXT NOT NULL,
  referral_code TEXT UNIQUE NOT NULL,
  referral_count INTEGER DEFAULT 0,
  earnings DECIMAL DEFAULT 0,
  created_at TIMESTAMP DEFAULT NOW()
);

-- Enable Row Level Security
ALTER TABLE referrers ENABLE ROW LEVEL SECURITY;

-- Allow public inserts
CREATE POLICY "Enable insert for everyone" ON referrers
  FOR INSERT WITH CHECK (true);

-- Allow public selects
CREATE POLICY "Enable select for everyone" ON referrers
  FOR SELECT USING (true);`);
          } else {
            showError('Registration error: ' + error.message);
          }
          submitBtn.innerHTML = originalText;
          submitBtn.disabled = false;
          return;
        }
        
        console.log('✅ User registered successfully:', newUser);
        
        // Save to localStorage
        if (newUser && newUser.length > 0) {
          localStorage.setItem('optob_referrer', JSON.stringify(newUser[0]));
          
          // Show success message
          showSuccess(`✅ Registration successful!<br><br>Your referral code: <strong class="text-xl">${referralCode}</strong><br><br>Share this code with friends!<br>You earn ₦200 for each friend who joins using your code.<br><br>Redirecting to dashboard...`);
          
          // Redirect to dashboard after 3 seconds
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 3000);
        } else {
          showError('Registration completed but no user data returned.');
          submitBtn.innerHTML = originalText;
          submitBtn.disabled = false;
        }
        
      } catch (err) {
        console.error('❌ Unexpected error:', err);
        showError('An unexpected error occurred: ' + err.message);
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
      }
    });
    
    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.innerHTML = '<i class="fas fa-exclamation-triangle mr-2"></i> ' + message;
      errorDiv.classList.remove('hidden');
      setTimeout(() => {
        errorDiv.classList.add('hidden');
      }, 8000);
    }
    
    function showSuccess(message) {
      const successDiv = document.getElementById('successMessage');
      successDiv.innerHTML = message;
      successDiv.classList.remove('hidden');
    }
    
    function showDebug(message) {
      const debugDiv = document.getElementById('debugMessage');
      debugDiv.innerHTML = '<i class="fas fa-bug mr-2"></i> ' + message.replace(/\n/g, '<br>');
      debugDiv.classList.remove('hidden');
    }
  </script>
</body>
</html>
